# Ghost of Tsushima Hyprland theme fragment
$activeBorderColor = rgba(c1121fee) rgba(d4af37dd) rgba(4a6fa5bb) 45deg
$inactiveBorderColor = rgba(151821aa)
$shadowColor = rgba(0c0e128c)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 2
    gaps_in = 8
    gaps_out = 16
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    active_opacity = 0.98
    inactive_opacity = 0.94
    rounding = 12

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 25
        render_power = 3
        color = $shadowColor
    }
}
